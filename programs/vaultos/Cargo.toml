[package]
name = "vaultos"
version = "0.1.0"
description = "VaultOS Solana Treasury and Governance Operating System"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vaultos"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }

[lints.rust]
unexpected_cfgs = "allow"
